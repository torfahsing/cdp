name: CI

on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: [self-hosted, ubuntu, developer-foundations]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...
